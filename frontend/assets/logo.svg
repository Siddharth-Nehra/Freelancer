<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="fh-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#087BFF" />
    </linearGradient>
    
    <!-- Blue to Violet to Pink Gradient -->
    <linearGradient id="fh-grad-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087BFF" />
      <stop offset="50%" stop-color="#762BFF" />
      <stop offset="100%" stop-color="#F000D8" />
    </linearGradient>

    <!-- Pink to Magenta Gradient -->
    <linearGradient id="fh-grad-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#762BFF" />
      <stop offset="50%" stop-color="#F000D8" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="fh-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#fh-neon-glow)">
    <!-- Top folded segment: cyan-blue ribbon -->
    <path d="M14 16 L25 7 L37 14 L29 19 L21 14 Z" fill="url(#fh-grad-top)" />
    <!-- Diagonal descending segment: blue-violet-pink ribbon -->
    <path d="M37 14 L37 23 L22 33 L14 26 L29 19 Z" fill="url(#fh-grad-mid)" />
    <!-- Bottom folded segment: pink-magenta ribbon -->
    <path d="M14 26 L22 33 L26 41 L14 34 Z" fill="url(#fh-grad-bot)" />
    <path d="M22 33 L34 41 L26 41 Z" fill="#F000D8" opacity="0.9" />
    
    <!-- Outer isometric loop strokes for crisp depth -->
    <path d="M25 6 L38 14 L38 24 L24 34 L13 26 L13 16 Z" 
          stroke="url(#fh-grad-mid)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.4" />
    
    <!-- Stylized geometric S stroke -->
    <path d="M34 11.5 L25 5.5 L14 13 L14 21 L28 17 L35 21.5 L35 29.5 L24 37.5 L14 30.5" 
          stroke="url(#fh-grad-top)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M14 21 L28 17 L35 21.5 L35 29.5 L24 37.5 L14 30.5" 
          stroke="url(#fh-grad-bot)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
